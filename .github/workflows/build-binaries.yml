name: build-binaries
on:
  workflow_dispatch:
    inputs:
      binary-name:
        description: Name of the binary (without extension)
        required: false
        default: gatus
  release:
    types: [published]
jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: gatus-linux-amd64
            binary-suffix: ""
          - runs-on: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact: gatus-linux-arm64
            binary-suffix: ""
          - runs-on: ubuntu-latest
            goos: windows
            goarch: amd64
            artifact: gatus-windows-amd64
            binary-suffix: ".exe"
          - runs-on: macos-latest
            goos: darwin
            goarch: arm64
            artifact: gatus-darwin-arm64
            binary-suffix: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="${{ github.event.inputs.binary-name || 'gatus' }}${{ matrix.binary-suffix }}"
          go build -ldflags="-s -w" -o "$BINARY_NAME" .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ github.event.inputs.binary-name || 'gatus' }}${{ matrix.binary-suffix }}
          compression-level: 0
